[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/seanabreau/vfy"

[workspace.dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
criterion = { version = "=0.8.0", default-features = false }
codspeed-criterion-compat = "=5.0.1"
fancy-regex = "=0.19.0"
regex = "=1.13.1"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"
indexmap = "=2.14.0"
insta = { version = "=1.48.0", features = ["json", "yaml"] }
jiff = "=0.2.35"
vfy-core = { path = "crates/vfy-core", version = "=0.0.2" }
nix = { version = "=0.31.3", default-features = false, features = ["user"] }
notify = "=8.2.0"
proptest = "=1.11.0"
pyo3 = { version = "=0.29.2", features = ["abi3-py312"] }
pep440_rs = { version = "=0.7.3", default-features = false }
rayon = "=1.12.0"
# Reuse Ruff's parser and AST without depending on its CLI or resolver.
ruff_python_ast = "=0.0.10"
ruff_python_parser = "=0.0.10"
ruff_text_size = "=0.0.10"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "serialize"] }
rustc-hash = "=2.1.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
smallvec = { version = "=1.15.2", default-features = false }
sha2 = "=0.11.0"
# Coverage.py annotation filenames hash their directory with SHA3-256.
sha3 = { version = "=0.12.0", default-features = false }
tempfile = "=3.27.0"
toml = { version = "1.1.2", features = ["preserve_order"] }
# LCOV fields follow Python's printable Unicode general categories.
unicode-general-category = "=1.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
# Public items must be nameable and reachable so the crate API stays explicit.
unnameable_types = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
collapsible_if = "deny"
# AGENTS.md requires named enums or options structs instead of Boolean arguments.
fn_params_excessive_bools = "deny"
# Clones on the data path undo the ownership work AGENTS.md asks for.
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
uninlined_format_args = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true

# Keep release optimizations while retaining symbols for flamegraphs and profilers.
[profile.profiling]
inherits = "release"
debug = "full"
strip = false
