version = 1
name = "vfy"

[setup]
script = '''
set -eu
export PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.pyenv/shims:/opt/homebrew/bin"
export UV_PROJECT_ENVIRONMENT="$PWD/.venv"
uv sync --locked --group dev
'''

[[actions]]
name = "Build extension"
icon = "tool"
command = "uv sync --locked --group dev --reinstall-package vfy"

[[actions]]
name = "Python tests"
icon = "test"
command = "uv run pytest"

[[actions]]
name = "Rust tests"
icon = "test"
command = "scripts/cargo-test.sh --locked --workspace --no-default-features"

[[actions]]
name = "Lint"
icon = "tool"
command = "uv run ruff format --check . && uv run ruff check . && cargo fmt --check"
