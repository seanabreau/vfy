name: Rust property tests

on:
  schedule:
    - cron: "41 5 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rust-properties-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  properties:
    name: Extended Rust property cases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked Rust test environment
        run: uv sync --locked --group dev
      - name: Install nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Run extended Rust property cases
        env:
          PROPTEST_CASES: "4096"
        shell: bash
        run: scripts/cargo-nextest.sh --locked --workspace --no-default-features
      - name: Persist minimized property regressions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-property-regressions
          path: |
            proptest-regressions
            crates/vfy-core/proptest-regressions
          if-no-files-found: ignore
