name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  change-scope:
    name: Determine CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      check_docs: ${{ steps.classify.outputs.check_docs }}
      check_release: ${{ steps.classify.outputs.check_release }}
      check_corpus: ${{ steps.classify.outputs.check_corpus }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_change_plan.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

  repository:
    name: Repository checks
    needs: change-scope
    if: needs.change-scope.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked repository-check dependencies
        run: uv sync --locked --group dev --group benchmark --no-install-project
      - name: Python formatting, linting and metadata checks
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync validate-pyproject pyproject.toml
      - name: Type check supported Python versions
        run: |
          # Version guards select different monitoring APIs across Python releases.
          uv run --no-sync ty check --python-version 3.12
          uv run --no-sync ty check --python-version 3.13
          uv run --no-sync ty check --python-version 3.14
          uv run --no-sync ty check --python-version 3.15
      - name: Rust formatting
        run: cargo fmt --check
      # These tests read repository files only. The root conftest imports the
      # installed vfy package, which this job does not build.
      - name: Architecture and repository tests
        run: >-
          uv run --no-sync pytest -q --noconftest
          tests/repository/test_architecture.py
          tests/repository/test_ci_change_plan.py
          tests/repository/test_ci_results.py
          tests/repository/test_ci_metrics.py
          tests/repository/test_layout.py
          tests/repository/test_release_artifacts.py
          tests/repository/test_workflows.py

  documentation:
    name: Documentation checks
    needs: change-scope
    if: needs.change-scope.outputs.check_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build the strict documentation site
        run: |
          uv sync --locked --only-group docs --no-install-project
          uv run --no-sync zensical build --clean --strict
      - name: Execute documented examples
        if: needs.change-scope.outputs.scope == 'documentation'
        run: |
          uv sync --locked --group dev
          uv run --no-sync pytest -q tests/integration/test_documentation.py tests/integration/test_documented_semantic.py
      - name: Install and run the pinned standalone tutorials
        run: uv run --no-sync python scripts/check_tutorial_install.py

  linux-wheel:
    name: Test Linux wheel on Python 3.12
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'documentation' && needs.change-scope.outputs.check_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          sccache: "true"
          command: build
          args: --release --locked --out dist
      - name: Smoke test the wheel in an empty environment
        run: |
          uv venv --python 3.12 target/wheel-smoke
          uv pip install --no-index --python target/wheel-smoke/bin/python dist/vfy-*.whl
          target/wheel-smoke/bin/python scripts/smoke_wheel.py
      - name: Install the locked test dependencies and the built wheel
        run: |
          uv sync --locked --group dev --group benchmark --no-install-project --python 3.12
          uv pip install --reinstall --no-deps dist/vfy-*.whl
      - name: Verify installed native typing declarations
        run: uv run --no-sync python scripts/check_wheel_typing.py
      - name: Run the complete Python suite
        run: uv run --no-sync pytest -n auto

  rust:
    name: Rust lints and workspace tests
    needs: change-scope
    if: >-
      needs.change-scope.outputs.check_release != 'true' &&
      (needs.change-scope.outputs.scope == 'rust' || needs.change-scope.outputs.scope == 'unknown')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked Rust test environment
        run: uv sync --locked --group dev
      - name: Lint Rust targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test the Rust core without the extension environment
        run: env -u PYO3_PYTHON cargo test --locked --manifest-path crates/vfy-core/Cargo.toml
      - name: Install Rust test runners
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-nextest@0.9.143,cargo-insta@1.48.0
          fallback: none
      - name: Test the Rust workspace and check reviewed snapshots
        run: scripts/cargo-insta-test.sh --locked --workspace --no-default-features

  release-tooling:
    name: Check release tooling
    needs: change-scope
    if: needs.change-scope.outputs.check_release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-verify.yml

  corpus-tooling:
    name: Check native corpus tooling
    needs: change-scope
    if: needs.change-scope.outputs.check_corpus == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/native-pytest.yml
    with:
      merge_check: true

  supply-chain:
    name: Dependency hygiene, licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.13.4
          fallback: none
      - name: Unused Rust dependencies and source files
        run: cargo shear --deny-warnings --check-test-targets
      - name: Dependency licenses and advisories
        run: cargo deny --locked --workspace --config .github/deny.toml check --show-stats

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
          version: 1.29.0

  ci-summary:
    name: CI summary
    if: always()
    needs: [change-scope, repository, documentation, linux-wheel, rust, release-tooling, corpus-tooling, supply-chain, workflow-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the selected jobs completed
        env:
          CHANGE_SCOPE: ${{ needs.change-scope.result }}
          SCOPE: ${{ needs.change-scope.outputs.scope }}
          CHECK_DOCS: ${{ needs.change-scope.outputs.check_docs }}
          CHECK_RELEASE: ${{ needs.change-scope.outputs.check_release }}
          CHECK_CORPUS: ${{ needs.change-scope.outputs.check_corpus }}
          REPOSITORY: ${{ needs.repository.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          LINUX_WHEEL: ${{ needs.linux-wheel.result }}
          RUST: ${{ needs.rust.result }}
          RELEASE: ${{ needs.release-tooling.result }}
          NATIVE_CORPUS: ${{ needs.corpus-tooling.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          WORKFLOW_SECURITY: ${{ needs.workflow-security.result }}
        run: bash scripts/check_ci_results.sh
