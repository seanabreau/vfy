name: Ecosystem differential

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ecosystem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  differential:
    name: Coverage.py ecosystem differential
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked project environment
        run: uv sync --locked --group dev
      - name: Install pinned ecosystem revisions
        run: >-
          uv pip install --python .venv/bin/python
          attrs==25.4.0 click==8.3.1 httpx==0.28.1
      - name: Build the release extension
        run: uv run maturin develop --release --skip-install
      - name: Compare Rust data and report totals
        run: uv run --no-sync python scripts/ecosystem_differential.py

  native-projects:
    name: Native test runner ecosystem differential
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          version: "0.12.7"
          enable-cache: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: build
          args: --release --locked --out dist
      - name: Compare pinned project suites with stock pytest
        env:
          CORPUS_WORK: ${{ runner.temp }}/vfy-native-projects
          CORPUS_TIMEOUT: "300"
          PYTHONHASHSEED: "0"
        run: |
          python validation/pytest_runner/real_packages/corpus.py run \
            --wheel dist/vfy-*.whl --jobs 2 \
            --out target/native-projects \
            Click Starlette
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-projects
          path: |
            dist/vfy-*.whl
            target/native-projects/
          if-no-files-found: warn

  real-projects:
    name: Recorded project parity
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: rich
            python: "3.12"
            parity_policy: required
          - project: rich
            python: "3.13"
            parity_policy: required
          - project: rich
            python: "3.14"
            parity_policy: diagnostic
            expected_pattern: "schema-7"
          - project: requests
            python: "3.12"
            parity_policy: required
          - project: requests
            python: "3.13"
            parity_policy: required
          - project: requests
            python: "3.14"
            parity_policy: required
          - project: datasette
            python: "3.12"
            parity_policy: diagnostic
            expected_pattern: >-
              Failed to generate report|Couldn't parse|^RuntimeError: coverage measured-file sets differ:
              pytest-cov only \(0\)=\[\], vfy only \(1\)=\['datasette/utils/shutil_backport\.py'\]$
    uses: ./.github/workflows/ecosystem-project.yml
    permissions:
      contents: read
    with:
      project: ${{ matrix.project }}
      python: ${{ matrix.python }}
      parity_policy: ${{ matrix.parity_policy || 'required' }}
      expected_pattern: ${{ matrix.expected_pattern || '' }}
