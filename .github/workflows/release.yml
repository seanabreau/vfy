name: Release

# workflow_dispatch verifies artifacts and notes; only tags publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Verify the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "error: release tag $GITHUB_REF_NAME must point to a commit on main" >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: version
        name: Match the tag against Cargo.toml
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(python scripts/check_release_version.py --tag "$GITHUB_REF_NAME")
          else
            version=$(python scripts/check_release_version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require release notes for the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/changelog_section.py "$VERSION"

  build-wheels:
    name: Wheel ${{ matrix.id }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            smoke: docker
            platform: linux/amd64
            image: python:3.12-slim
          - id: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke: docker
            platform: linux/amd64
            image: python:3.12-alpine
          - id: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            smoke: docker
            platform: linux/arm64
            image: python:3.12-slim
          - id: linux-aarch64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke: docker
            platform: linux/arm64
            image: python:3.12-alpine
          - id: macos-x86_64
            os: macos-15-intel
            target: x86_64
            manylinux: "off"
            smoke: extension
          - id: macos-aarch64
            os: macos-latest
            target: aarch64
            manylinux: "off"
            smoke: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: arm64
      - name: Use portable Rust source paths in native wheels
        if: runner.os != 'Linux'
        shell: python
        run: |
          import os
          from pathlib import Path

          paths = {
              Path.cwd(): "/build/vfy",
              Path(os.environ.get("CARGO_HOME", Path.home() / ".cargo")): "/cargo",
              Path(os.environ.get("RUSTUP_HOME", Path.home() / ".rustup")): "/rustup",
          }
          flags = []
          for path, public in paths.items():
              for spelling in dict.fromkeys([str(path), path.as_posix()]):
                  flags.append(f"--remap-path-prefix={spelling}={public}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print("CARGO_ENCODED_RUSTFLAGS=" + chr(31).join(flags), file=env)
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            export RUSTFLAGS="--remap-path-prefix=$PWD=/build/vfy --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
          command: build
          args: --release --locked --out dist
      - name: Make wheel SBOM component IDs portable
        shell: bash
        run: python scripts/normalize_release_sboms.py dist/*.whl
      - name: Install and check the wheel on the target platform
        if: matrix.smoke == 'docker'
        env:
          DOCKER_IMAGE: ${{ matrix.image }}
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: >-
          docker run --rm --platform "$DOCKER_PLATFORM"
          --volume "$PWD:/io" --workdir /io "$DOCKER_IMAGE"
          sh -c 'python -m pip install --only-binary :all: dist/*.whl
          && python scripts/smoke_wheel.py'
      - name: Install and check the wheel
        if: matrix.smoke == 'extension'
        shell: bash
        run: |
          python -m pip install --force-reinstall --only-binary :all: dist/*.whl
          python scripts/smoke_wheel.py
      - name: Record what this wheel was checked with
        shell: bash
        env:
          BUILD_ID: ${{ matrix.id }}
          DOCKER_IMAGE: ${{ matrix.image }}
          DOCKER_PLATFORM: ${{ matrix.platform }}
          RUNNER_IMAGE: ${{ matrix.os }}
          SMOKE_MODE: ${{ matrix.smoke }}
        run: |
          case "$SMOKE_MODE" in
            none) note="built only, no runner or emulator available for this target" ;;
            docker) note="installed and checked in $DOCKER_IMAGE on $DOCKER_PLATFORM" ;;
            *) note="installed and checked through the Python extension on $RUNNER_IMAGE" ;;
          esac
          echo "- \`$BUILD_ID\`: $note" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-wheel-${{ matrix.id }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build the source distribution
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - name: Build the sdist from source and check it
        env:
          MATURIN_PEP517_ARGS: --locked
        run: |
          python -m pip install --force-reinstall --no-binary vfy dist/*.tar.gz
          python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release-tests:
    name: Test release ${{ matrix.id }} wheel on Python ${{ matrix.python }}
    needs: [version, build-wheels]
    runs-on: ${{ matrix.os }}
    # Full serial suite plus the native pytest-version matrix.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x86_64, os: ubuntu-latest, python: "3.12" }
          - { id: linux-x86_64, os: ubuntu-latest, python: "3.13" }
          - { id: linux-x86_64, os: ubuntu-latest, python: "3.14" }
          - { id: linux-x86_64, os: ubuntu-latest, python: "3.15" }
          - { id: macos-aarch64, os: macos-latest, python: "3.12" }
          - { id: macos-aarch64, os: macos-latest, python: "3.14" }
          - { id: macos-aarch64, os: macos-latest, python: "3.15" }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-wheel-${{ matrix.id }}
          path: dist
      - name: Install locked test dependencies and the release wheel
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv sync --locked --group dev --group benchmark --no-install-project --python "$PYTHON_VERSION"
          uv pip install --reinstall --no-deps dist/*.whl
      - name: Run the complete suite against the installed release wheel
        run: uv run --no-sync pytest -q
      - name: Verify installed native typing declarations
        run: uv run --no-sync python scripts/check_wheel_typing.py
      - name: Check minimum xdist with pinned pytest
        if: matrix.id == 'linux-x86_64' && matrix.python == '3.12'
        shell: bash
        run: |
          uv pip install "pytest==9.1.1" "pytest-xdist==3.6.1"
          uv run --no-sync pytest -q tests/integration/test_pytest_cov_compat.py
      - name: Check asyncio compatibility with pinned pytest
        if: matrix.id == 'linux-x86_64' && matrix.python == '3.12'
        shell: bash
        run: |
          uv pip uninstall pytest-asyncio
          uv run --no-sync pytest -q tests/integration/test_asyncio_floor.py
      - name: Test native pytest range without xdist
        if: matrix.id == 'linux-x86_64' && matrix.python == '3.12'
        run: bash scripts/check_native_pytest_versions.sh

  release-rust:
    name: Test release Rust workspace
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install the locked Rust test environment
        run: uv sync --locked --group dev
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Run the tagged workspace tests
        shell: bash
        run: scripts/cargo-nextest.sh --locked --workspace --no-default-features

  sbom:
    name: Build the dependency SBOM
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      # cargo-cyclonedx has no --locked, so the lock file is checked instead.
      - name: Describe the compiled dependency tree
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo cyclonedx --all --format json \
            --override-filename "vfy-$VERSION.sbom"
          git diff --exit-code -- Cargo.lock
          # cargo-cyclonedx writes one SBOM beside each crate's Cargo.toml.
          mkdir -p sbom
          for crate in vfy vfy-core vfy-pytest; do
            mv "crates/$crate/vfy-$VERSION.sbom.json" "sbom/$crate-$VERSION.sbom.json"
          done
          python3 scripts/normalize_release_sboms.py sbom/*.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*.sbom.json
          if-no-files-found: error

  verify:
    name: Verify the release artifacts
    needs: [version, build-wheels, build-sdist, sbom, release-tests, release-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Match every artifact against Cargo.toml
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="--tag $GITHUB_REF_NAME"
          else
            tag=""
          fi
          # shellcheck disable=SC2086
          python scripts/check_release_version.py $tag --dist dist --expected-wheels 6
      - name: Publish the artifact list
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "### Artifacts for $VERSION"
            for path in dist/*; do echo "- \`$(basename "$path")\`"; done
            echo "### Release notes"
            python scripts/changelog_section.py "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/vfy
    permissions:
      attestations: write # Attach provenance to every distribution.
      contents: read
      id-token: write # Authenticate to PyPI through trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    name: Create the GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Create the release and upload its artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - name: Create the release after PyPI succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python scripts/changelog_section.py "$VERSION" --output notes.md
          gh release create "$GITHUB_REF_NAME" dist/* sbom/* \
            --verify-tag --title "$VERSION" --notes-file notes.md
