# Checked in CI with `cargo deny --config .github/deny.toml check`.

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Every allowed license is permissive and compatible with the project's
# Apache-2.0 OR MIT distribution. Dual-licensed crates resolve to one of these.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

# The pinned filesystem watcher and its Linux adapters use these licenses.
[[licenses.exceptions]]
name = "notify"
version = "=8.2.0"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
name = "inotify"
version = "=0.11.5"
allow = ["ISC"]

[[licenses.exceptions]]
name = "inotify-sys"
version = "=0.1.8"
allow = ["ISC"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
