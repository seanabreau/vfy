version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
